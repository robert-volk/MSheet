name: MSheet
options:
  bundleIdPrefix: dev.robertvolk
  deploymentTarget:
    iOS: "17.0"

targets:
  MSheet:
    type: application
    platform: iOS
    sources:
      - path: Sources/MSheet
        excludes:
          - Info.plist
    info:
      path: Sources/MSheet/Info.plist
      properties:
        CFBundleDisplayName: "MSheet"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "Used to hear you while searching for sheet music by voice."
        NSSpeechRecognitionUsageDescription: "Used to turn your spoken search into text."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.robertvolk.msheet
        PRODUCT_NAME: MSheet
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
